<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IP Address Viewer</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="container">
      <!-- Header -->
      <header class="header">
        <div class="header-content">
          <svg
            class="logo"
            viewBox="0 0 24 24"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"
              fill="currentColor"
            />
          </svg>
          <h1 class="title">IP Address Viewer</h1>
        </div>
      </header>

      <!-- Info text -->
      <p class="info-text" data-i18n="infoText">Tus direcciones IP públicas</p>

      <!-- IP Cards -->
      <div class="ip-cards">
        <!-- IPv4 Card -->
        <div class="ip-card">
          <div class="ip-header">
            <span class="ip-label">IPv4</span>
            <div class="status-indicator" id="ipv4-status">
              <span class="status-dot loading"></span>
              <span class="status-text" data-i18n="statusLoading">Cargando...</span>
            </div>
          </div>
          <div class="ip-content">
            <div class="ip-address" id="ipv4-address">
              <span class="loading-text" data-i18n="obtainingAddress">Obteniendo dirección...</span>
            </div>
            <button class="copy-btn" id="copy-ipv4" data-i18n-title="copyIpv4Title" title="Copiar IPv4" disabled>
              <svg
                class="copy-icon"
                viewBox="0 0 24 24"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
              >
                <rect
                  x="9"
                  y="9"
                  width="13"
                  height="13"
                  rx="2"
                  stroke="currentColor"
                  stroke-width="2"
                />
                <path
                  d="M5 15H4C2.89543 15 2 14.1046 2 13V4C2 2.89543 2.89543 2 4 2H13C14.1046 2 15 2.89543 15 4V5"
                  stroke="currentColor"
                  stroke-width="2"
                />
              </svg>
              <span class="copy-text" data-i18n="copyLabel">Copiar</span>
            </button>
          </div>
        </div>

        <!-- IPv6 Card -->
        <div class="ip-card">
          <div class="ip-header">
            <span class="ip-label">IPv6</span>
            <div class="status-indicator" id="ipv6-status">
              <span class="status-dot loading"></span>
              <span class="status-text" data-i18n="statusLoading">Cargando...</span>
            </div>
          </div>
          <div class="ip-content">
            <div class="ip-address" id="ipv6-address">
              <span class="loading-text" data-i18n="obtainingAddress">Obteniendo dirección...</span>
            </div>
            <button class="copy-btn" id="copy-ipv6" data-i18n-title="copyIpv6Title" title="Copiar IPv6" disabled>
              <svg
                class="copy-icon"
                viewBox="0 0 24 24"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
              >
                <rect
                  x="9"
                  y="9"
                  width="13"
                  height="13"
                  rx="2"
                  stroke="currentColor"
                  stroke-width="2"
                />
                <path
                  d="M5 15H4C2.89543 15 2 14.1046 2 13V4C2 2.89543 2.89543 2 4 2H13C14.1046 2 15 2.89543 15 4V5"
                  stroke="currentColor"
                  stroke-width="2"
                />
              </svg>
              <span class="copy-text" data-i18n="copyLabel">Copiar</span>
            </button>
          </div>
        </div>
      </div>

      <!-- Actions -->
      <div class="actions">
        <button class="action-btn" id="refresh-btn" data-i18n-title="refreshTitle" title="Actualizar direcciones">
          <svg
            class="action-icon"
            viewBox="0 0 24 24"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"
              fill="currentColor"
            />
          </svg>
          <span data-i18n="refreshLabel">Actualizar</span>
        </button>
      </div>

      <!-- Footer -->
      <div class="footer">
        <a
          class="footer-link"
          href="https://github.com/Yenreh/IPExtention"
          target="_blank"
          rel="noreferrer"
          title="github.com/Yenreh"
        >
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0 1 12 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.203 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.919.678 1.852 0 1.336-.012 2.415-.012 2.743 0 .267.18.578.688.48C19.138 20.194 22 16.442 22 12.017 22 6.484 17.523 2 12 2z" fill="currentColor" />
          </svg>
          <span>by Yenreh</span>
        </a>
      </div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
